<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Virtual Instagram V1.8</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="icon-button home-button" aria-label="首頁">⌂</button>
    <div class="brand">Instagram</div>
    <div class="top-actions">
      <button class="icon-button explore-button" aria-label="探索">⌕</button>
      <button id="notifications-button" class="icon-button notification-button" aria-label="通知">♡<span id="notification-badge" class="notification-badge hidden">0</span></button>
      <button id="dm-button" class="icon-button notification-button" aria-label="訊息">✉<span id="dm-badge" class="notification-badge hidden">0</span></button>
      <button class="icon-button create-button" aria-label="新增">＋</button>
      <button class="avatar-button me-button" aria-label="我的個人頁"><img class="me-avatar-small" alt=""></button>
    </div>
  </header>

  <main id="feed-view" class="view active"><section class="content-shell"><div id="stories" class="stories"></div><div id="feed" class="feed"></div></section></main>

  <main id="profile-view" class="view profile-page">
    <header class="sub-header"><button class="icon-button back-button">‹</button><strong id="profile-header-name"></strong><span></span></header>
    <section class="profile-hero"><img id="profile-avatar" class="profile-avatar" alt=""><div class="profile-main"><div class="profile-title-row"><h1 id="profile-username"></h1><button id="follow-button" class="pill primary">追蹤</button><button id="profile-message" class="pill">發訊息</button></div><div id="relationship-status" class="relationship-status"></div><div class="stats"><span><b id="profile-post-count">0</b> 貼文</span><span><b id="profile-followers">0</b> 粉絲</span><span><b id="profile-following">0</b> 追蹤中</span></div><div class="bio"><strong id="profile-name"></strong><p id="profile-bio"></p></div></div></section>
    <section id="profile-highlights" class="profile-highlights"></section>
    <nav class="profile-tabs"><button class="active">▦</button><button>▶</button><button>♙</button></nav><section id="profile-grid" class="photo-grid"></section>
  </main>

  <main id="me-view" class="view profile-page">
    <header class="sub-header"><button class="icon-button home-button">⌂</button><strong id="me-header-name"></strong><button class="icon-button create-button">＋</button></header>
    <section class="profile-hero"><div class="avatar-wrap"><img id="me-avatar" class="profile-avatar" alt=""><button id="avatar-add" class="avatar-add">＋</button></div><div class="profile-main"><div class="profile-title-row"><h1 id="me-username"></h1></div><div class="stats"><span><b id="me-post-count">0</b> 貼文</span><span><b id="me-followers">0</b> 粉絲</span><span><b>3</b> 追蹤中</span></div><div class="bio"><strong id="me-name"></strong><p id="me-bio"></p></div></div></section>
    <section class="me-actions"><button id="edit-profile">編輯個人檔案</button><button id="share-profile">分享個人檔案</button><button class="toast-button" data-toast="探索好友後續再接">♟＋</button></section>
    <nav class="profile-tabs"><button class="active">▦</button><button>▶</button><button>♙</button></nav><section id="me-grid" class="photo-grid"></section>
    <section id="empty-me" class="empty-state"><div>▣</div><h2>分享相片</h2><p>發佈後會顯示在這裡，也會同步到首頁。</p><button class="pill primary create-button">新增貼文</button></section>
  </main>

  <main id="explore-view" class="view explore-page">
    <header class="explore-header"><strong>探索</strong><input id="explore-search" type="search" placeholder="搜尋人物、貼文、地點、Hashtag"></header>
    <section id="explore-people" class="explore-people"></section>
    <section id="explore-grid" class="explore-grid"></section>
    <section id="explore-empty" class="empty-state hidden"><div>⌕</div><h2>找不到結果</h2><p>換個名字或關鍵字試試看。</p></section>
  </main>

  <section id="detail-view" class="overlay-page">
    <header class="sub-header"><button id="detail-back" class="icon-button">‹</button><div class="detail-title"><strong>貼文</strong><span id="detail-subtitle"></span></div><button id="detail-options" class="icon-button">⋯</button></header>
    <div class="detail-user"><img id="detail-avatar" alt=""><div><strong id="detail-user"></strong><small id="detail-location"></small></div></div>
    <div id="detail-media"></div>
    <div class="detail-actions"><button id="detail-like" class="heart-button">♡</button><button id="detail-comment" class="comment-icon"><span></span></button><button id="detail-repost">↻</button><button id="detail-share">⌁</button><button id="detail-save" class="bookmark"><span></span></button></div>
    <div id="detail-likes" class="detail-likes"></div><div class="detail-caption"><strong id="detail-caption-user"></strong> <span id="detail-caption"></span></div><div id="detail-tags" class="post-tags"></div><div id="detail-time" class="detail-time"></div>
  </section>

  <nav class="bottom-nav"><button class="home-button">⌂</button><button class="toast-button" data-toast="Reel 預覽後續再接">▷</button><button class="create-button">＋</button><button class="explore-button">⌕</button><button class="me-button">●</button></nav>
</div>

<div id="create-sheet" class="modal bottom-sheet"><button class="backdrop modal-close"></button><section class="sheet"><div class="handle"></div><h2>建立</h2><button class="sheet-option toast-button modal-close" data-toast="Reel 功能後續再做">▷ <span>Reel</span></button><button id="create-post-choice" class="sheet-option">▦ <span>貼文</span></button></section></div>

<section id="composer" class="overlay-page composer">
  <header class="sub-header"><button id="composer-close" class="icon-button">×</button><strong id="composer-title">編輯</strong><button id="composer-next" class="text-button">下一步</button></header>
  <div id="edit-stage" class="composer-stage">
    <input id="post-file" type="file" accept="image/*" multiple hidden>
    <div id="editor-empty"><button id="pick-photo" class="pill primary pick-photo">從裝置選擇相片</button><p class="muted">一次可選 1～10 張</p></div>
    <div id="editor-workspace" class="hidden">
      <div class="editor-top-actions"><button id="editor-undo" class="mini-button">↶ 復原</button><button id="editor-redo" class="mini-button">↷ 重做</button><span class="muted">拖曳照片可換位置；拖曳文字／Emoji 可移動</span></div>
      <div id="editor-frame" class="editor-frame"><img id="editor-image" alt=""><div id="editor-tint" class="editor-tint"></div><div id="layers-overlay" class="layers-overlay"></div></div>
      <div id="editor-thumbs" class="editor-thumbs"></div>
      <div id="editor-tools" class="editor-tools"><button data-tool="text">Aa<span>文字</span></button><button data-tool="emoji">☺<span>Emoji</span></button><button data-tool="filter">◉<span>濾鏡</span></button><button data-tool="adjust">☷<span>調整</span></button><button data-tool="crop">⌗<span>裁切</span></button></div>

      <section id="text-panel" class="tool-panel hidden"><div class="panel-row"><button id="add-text" class="pill">＋ 新增文字</button><button id="delete-layer" class="pill danger">刪除圖層</button></div><div id="text-controls" class="control-grid"><label class="wide">內容<textarea id="text-content" maxlength="120" placeholder="輸入文字"></textarea></label><label>大小<input id="text-size" type="range" min="20" max="110" value="48"></label><label>透明度<input id="text-opacity" type="range" min="0.2" max="1" step="0.05" value="1"></label><label>旋轉<input id="text-rotation" type="range" min="-180" max="180" value="0"></label><label>文字色<input id="text-color" type="color" value="#ffffff"></label><label>字體<select id="text-font"><option value="Arial">Arial</option><option value="Georgia">Georgia</option><option value="Courier New">Courier</option><option value="Trebuchet MS">Trebuchet</option><option value="serif">Serif</option></select></label><label>背景色<input id="text-bg" type="color" value="#000000"></label><label class="check"><input id="text-bg-enabled" type="checkbox">文字背景</label><button id="text-bold" class="mini-button active">粗體</button></div></section>
      <section id="emoji-panel" class="tool-panel emoji-panel hidden"><p>點一下加入，加入後可以直接拖曳、縮放、旋轉。</p><div class="emoji-grid"><button data-emoji="❤️">❤️</button><button data-emoji="🔥">🔥</button><button data-emoji="✨">✨</button><button data-emoji="😂">😂</button><button data-emoji="🥹">🥹</button><button data-emoji="😎">😎</button><button data-emoji="☕">☕</button><button data-emoji="🎧">🎧</button><button data-emoji="📍">📍</button><button data-emoji="🌙">🌙</button><button data-emoji="💪">💪</button><button data-emoji="🖤">🖤</button></div></section>
      <section id="filter-panel" class="tool-panel filter-panel hidden"><button data-preset="original">原圖</button><button data-preset="vivid">鮮明</button><button data-preset="bw">黑白</button><button data-preset="warm">暖色</button><button data-preset="cool">冷色</button><button data-preset="fade">淡色</button></section>
      <section id="adjust-panel" class="tool-panel hidden"><div class="control-grid"><label>亮度<input id="brightness-range" type="range" min="50" max="150" value="100"></label><label>對比<input id="contrast-range" type="range" min="50" max="150" value="100"></label><label>飽和<input id="saturation-range" type="range" min="0" max="180" value="100"></label><label>模糊<input id="blur-range" type="range" min="0" max="8" step="0.5" value="0"></label><label>色溫<input id="warmth-range" type="range" min="-100" max="100" value="0"></label><label>縮放<input id="zoom-range" type="range" min="1" max="2.2" step="0.05" value="1"></label><label>旋轉<input id="photo-rotation" type="range" min="-180" max="180" value="0"></label><button id="flip-x" class="mini-button">水平翻轉</button><button id="reset-photo" class="mini-button">重設照片</button></div></section>
      <section id="crop-panel" class="tool-panel crop-panel hidden"><button data-crop="original">原圖</button><button data-crop="square">1:1</button><button data-crop="portrait">4:5</button><button data-crop="classic">3:4</button><button data-crop="story">9:16</button></section>
    </div>
  </div>
  <div id="caption-stage" class="caption-stage hidden"><header class="caption-inline-head"><button id="caption-back" class="mini-button">‹ 返回編輯</button><span id="caption-count"></span></header><div id="caption-preview" class="caption-preview"></div><textarea id="caption-input" placeholder="新增說明文字…… #hashtag"></textarea><input id="location-input" class="meta-input" placeholder="新增地點"><input id="tags-input" class="meta-input" placeholder="標註人物（用逗號分隔）"></div>
  <button id="publish-post" class="publish-button hidden">分享</button><div id="editor-busy" class="busy">處理中…</div>
</section>

<div id="comments-modal" class="modal bottom-sheet"><button class="backdrop modal-close"></button><section class="sheet comments-sheet"><header class="sheet-header"><strong>留言</strong><button class="icon-button modal-close">×</button></header><div id="comments-list" class="comments-list"></div><div id="comment-replying" class="comment-replying hidden"><span></span><button id="cancel-comment-reply">×</button></div><form id="comment-form" class="comment-form"><input id="comment-input" placeholder="新增留言…"><button>送出</button></form></section></div>

<div id="profile-edit-modal" class="modal bottom-sheet"><button class="backdrop modal-close"></button><section class="sheet"><header class="sheet-header"><strong>編輯個人檔案</strong><button class="icon-button modal-close">×</button></header><form id="profile-form" class="form"><label>帳號<input id="profile-form-username"></label><label>名稱<input id="profile-form-name"></label><label>自我介紹<textarea id="profile-form-bio"></textarea></label><label>大頭貼<input id="profile-form-avatar" type="file" accept="image/*"></label><button class="pill primary" type="submit">儲存</button></form></section></div>

<div id="post-options-modal" class="modal bottom-sheet"><button class="backdrop modal-close"></button><section class="sheet"><header class="sheet-header"><strong>貼文選項</strong><button class="icon-button modal-close">×</button></header><div class="form"><button id="edit-post-option" class="pill">重新編輯照片／文字</button><button id="edit-caption-option" class="pill">只改文案</button><button id="delete-post-option" class="pill danger">刪除貼文</button></div></section></div>


<input id="story-file" type="file" accept="image/*" hidden>
<section id="story-viewer" class="story-viewer">
  <div class="story-progress-track"><div id="story-progress" class="story-progress"></div></div>
  <header class="story-viewer-head">
    <button id="story-author" class="story-author"><img id="story-avatar" alt=""><span><strong id="story-username"></strong><small id="story-time"></small></span></button>
    <button id="story-close" class="icon-button" aria-label="關閉限時動態">×</button>
  </header>
  <img id="story-image" class="story-viewer-image" alt="限時動態">
  <div id="story-caption" class="story-viewer-caption"></div>
  <form id="story-reply-form" class="story-reply-form">
    <button type="button" data-story-reaction="❤️">❤️</button>
    <button type="button" data-story-reaction="🔥">🔥</button>
    <button type="button" data-story-reaction="😂">😂</button>
    <input id="story-reply-input" placeholder="回覆限時動態…">
    <button type="submit">送出</button>
  </form>
  <button id="story-prev" class="story-hit story-hit-prev" aria-label="上一則"></button>
  <button id="story-next" class="story-hit story-hit-next" aria-label="下一則"></button>
</section>

<section id="dm-page" class="overlay-page dm-page">
  <section id="dm-inbox">
    <header class="sub-header"><button id="dm-close" class="icon-button">×</button><strong>訊息</strong><span></span></header>
    <div id="dm-inbox-list" class="dm-inbox-list"></div>
  </section>
  <section id="dm-chat" class="hidden">
    <header class="sub-header">
      <button id="dm-chat-back" class="icon-button">‹</button>
      <button id="dm-chat-user" class="dm-chat-user"><img id="dm-chat-avatar" alt=""><span><strong id="dm-chat-title"></strong><small id="dm-chat-status"></small></span></button>
      <span></span>
    </header>
    <div id="dm-messages" class="dm-messages"></div>
    <form id="dm-form" class="dm-form"><input id="dm-input" placeholder="傳送訊息…"><button>送出</button></form>
  </section>
</section>

<div id="notification-modal" class="modal bottom-sheet">
  <button id="notification-backdrop" class="backdrop"></button>
  <section class="sheet notification-sheet">
    <header class="sheet-header"><strong>通知</strong><button id="notification-close" class="icon-button">×</button></header>
    <div id="notification-list" class="notification-list"></div>
  </section>
</div>

<div id="toast" class="toast"></div>
<script src="data.js"></script>
<script src="social-data.js"></script>
<script src="dialogue-data.js"></script>
<script src="relationships.js"></script>
<script src="social-engine.js"></script>
<script src="world-factory.js"></script>
<script src="world.js"></script>
<script src="store.js"></script>
<script src="editor-render.js"></script>
<script src="editor.js"></script>
<script src="dm.js"></script>
<script src="stories.js"></script>
<script src="notifications.js"></script>
<script src="app-core.js"></script>
<script src="app-feed.js"></script>
<script src="app-profile.js"></script>
<script src="app-explore.js"></script>
<script src="app.js"></script>
</body>
</html>
