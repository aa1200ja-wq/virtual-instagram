<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>我的個人頁｜IG 模擬器</title>
    <link rel="shortcut icon" href="assets/favicon.svg" type="image/x-icon" />
    <link rel="stylesheet" href="my-profile.css" />
    <link rel="stylesheet" href="my-profile-flow.css" />
    <link rel="stylesheet" href="my-profile-editor.css" />
    <script src="simulator-data.js" defer></script>
    <script src="my-profile-editor.js" defer></script>
    <script src="my-profile.js" defer></script>
  </head>
  <body>
    <main class="me-page">
      <header class="me-topbar">
        <button class="me-icon me-icon--plus" type="button" aria-label="新增內容" data-add-post>＋</button>
        <button class="me-account" type="button">
          <strong class="me-account__name"></strong>
          <span class="me-account__chevron">⌄</span>
        </button>
        <div class="me-topbar__actions">
          <button class="me-icon me-icon--threads" type="button" aria-label="Threads">＠</button>
          <button class="me-icon me-icon--menu" type="button" aria-label="選單">
            <span></span><span></span><span></span>
          </button>
        </div>
      </header>

      <section class="me-summary">
        <div class="me-avatar-area">
          <div class="me-avatar-wrap">
            <img class="me-avatar" alt="" />
            <button class="me-avatar-add" type="button" aria-label="新增大頭貼">＋</button>
          </div>
        </div>

        <div class="me-stats">
          <div><strong class="me-post-count">0</strong><span>則貼文</span></div>
          <div><strong class="me-followers">0</strong><span>位粉絲</span></div>
          <div><strong class="me-following">0</strong><span>追蹤中</span></div>
        </div>
      </section>

      <section class="me-bio">
        <strong class="me-display-name"></strong>
        <p class="me-bio-text"></p>
      </section>

      <section class="me-actions">
        <button type="button">編輯個人檔案</button>
        <button type="button">分享個人檔案</button>
        <button class="me-actions__small" type="button" aria-label="探索好友">♟＋</button>
      </section>

      <nav class="me-tabs" aria-label="個人頁分類">
        <button class="me-tab me-tab--active" type="button">▦</button>
        <button class="me-tab" type="button">▶</button>
        <button class="me-tab" type="button">♙</button>
      </nav>

      <section class="me-grid" aria-label="我的貼文"></section>
      <section class="me-empty" hidden>
        <button class="me-empty__add" type="button">
          <div class="me-empty__icon">▣</div>
          <strong>分享相片</strong>
          <p>當你分享相片後，就會顯示在個人檔案中。</p>
        </button>
      </section>
      <nav class="me-bottom-nav" aria-label="主要導覽">
        <button type="button">⌂</button>
        <button type="button">▻</button>
        <button type="button">⌁</button>
        <button type="button">⌕</button>
        <button class="me-bottom-nav__avatar" type="button"><img class="me-nav-avatar" alt="" /></button>
      </nav>
    </main>

    <input class="me-file-input" type="file" accept="image/*" hidden />

    <div class="create-sheet" aria-hidden="true">
      <button class="screen-backdrop" type="button" aria-label="關閉建立選單"></button>
      <section class="create-sheet__panel">
        <div class="create-sheet__handle"></div>
        <h2>建立</h2>
        <button class="create-sheet__option" type="button" data-create-reel>
          <span class="create-sheet__icon">▷</span><span>Reel</span>
        </button>
        <button class="create-sheet__option" type="button" data-create-post>
          <span class="create-sheet__icon">▦</span><span>貼文</span>
        </button>
      </section>
    </div>

    <section class="post-editor" aria-hidden="true">
      <header class="flow-topbar">
        <button class="flow-close" type="button" aria-label="關閉">×</button>
        <span></span>
        <span></span>
      </header>
      <div class="post-editor__stage">
        <div class="post-editor__canvas">
          <img class="post-editor__image" alt="貼文預覽" />
          <div class="editor-text-overlay"></div>
        </div>
      </div>
      <div class="post-editor__tools">
        <button type="button" data-editor-tool="text"><strong>Aa</strong><span>文字</span></button>
        <button type="button" data-editor-tool="filter"><strong>◉</strong><span>濾鏡</span></button>
        <button type="button" data-editor-tool="edit"><strong>☷</strong><span>編輯</span></button>
      </div>
      <div class="editor-panel editor-panel--text" hidden>
        <input class="editor-text-input" maxlength="60" placeholder="輸入要放在照片上的文字" />
      </div>
      <div class="editor-panel editor-panel--filter" hidden>
        <button type="button" data-filter="none">原圖</button>
        <button type="button" data-filter="grayscale(1)">黑白</button>
        <button type="button" data-filter="sepia(.35) saturate(1.25)">暖色</button>
        <button type="button" data-filter="saturate(.85) hue-rotate(175deg)">冷色</button>
      </div>
      <div class="editor-panel editor-panel--edit" hidden>
        <label>縮放 <input class="editor-zoom" type="range" min="1" max="1.8" step=".05" value="1" /></label>
        <button class="editor-rotate" type="button">旋轉 90°</button>
        <button class="editor-reset" type="button">重設</button>
      </div>
      <button class="post-editor__next" type="button">下一步 →</button>
    </section>

    <section class="post-caption" aria-hidden="true">
      <header class="caption-topbar">
        <button class="caption-back" type="button" aria-label="返回">‹</button>
        <strong>新貼文</strong>
        <button class="caption-share" type="button">分享</button>
      </header>
      <div class="post-caption__content">
        <img class="post-caption__image" alt="貼文預覽" />
        <textarea class="post-caption__text" maxlength="500" placeholder="新增說明文字……"></textarea>
      </div>
    </section>

    <section class="me-post-detail" aria-hidden="true">
      <header class="detail-topbar">
        <button class="detail-back" type="button" aria-label="返回">‹</button>
        <div><strong>貼文</strong><span class="detail-account"></span></div>
        <span></span>
      </header>
      <div class="detail-userbar">
        <img class="detail-avatar" alt="" />
        <strong class="detail-username"></strong>
        <button type="button">☰</button>
      </div>
      <img class="detail-image" alt="貼文圖片" />
      <div class="detail-actions">
        <button class="detail-like" type="button" aria-label="按讚">
          <span class="detail-like__heart">♡</span>
        </button>
        <button class="detail-comment" type="button" aria-label="留言">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 11.5a8.5 8.5 0 1 1-3.2-6.64A8.4 8.4 0 0 1 21 11.5Z"/>
            <path d="M7.5 19.2 4 21l1.15-3.75"/>
          </svg>
        </button>
        <button class="detail-repost" type="button" aria-label="轉發">↻</button>
        <button class="detail-share" type="button" aria-label="分享">⌁</button>
      </div>
      <div class="detail-likes"></div>
      <div class="detail-caption"><strong class="detail-caption__user"></strong> <span class="detail-caption__text"></span></div>
      <div class="detail-date"></div>
    </section>

    <div class="reel-toast" role="status" aria-live="polite">Reel 功能後續再做</div>

  </body>
</html>
